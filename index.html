<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calfect｜YUTAKANO</title>
<meta name="description" content="Calfect（カルフェクト）は、月表示と選んだ日の予定を1画面で見られるカレンダーアプリです。">
<link rel="icon" href="icon.png">
<style>
:root { --bg:#ffffff; --fg:#1b2230; --muted:#6b7486; --line:#e2e5ec; --accent:#2b4c7e; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg:#11151d; --fg:#e8ebf1; --muted:#939bab; --line:#2a3140; --accent:#8fb0e6; color-scheme: dark; } }
body { margin:0; background:var(--bg); color:var(--fg); font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif; line-height:1.8; font-size:15px; }
main { max-width:720px; margin:0 auto; padding:40px 16px 64px; }
.app { display:flex; gap:16px; align-items:center; margin-bottom:24px; }
.app img { width:88px; height:88px; border-radius:20px; border:1px solid var(--line); }
h1 { font-size:26px; margin:0; }
.sub { color:var(--muted); margin:0; font-size:14px; }
h2 { font-size:17px; margin:32px 0 8px; padding-bottom:4px; border-bottom:1px solid var(--line); }
a { color:var(--accent); }
ul { padding-left:20px; }
li { margin-bottom:4px; }
footer { margin-top:48px; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<main>
<div class="app">
  <img src="icon.png" alt="Calfect のアイコン">
  <div>
    <h1>Calfect</h1>
    <p class="sub">カルフェクト｜カレンダーアプリ</p>
  </div>
</div>

<p>月の表示と、選んだ日の予定（内容と場所）を1つの画面で見られるカレンダーアプリです。iCloud・Google・Outlook のカレンダーをまとめて表示し、天気予報や雨雲レーダー、毎日育つ守り神も楽しめます。</p>
